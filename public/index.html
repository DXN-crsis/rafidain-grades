<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعدادية الرافدين المهنية — الاستعلام عن النتائج</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/logo.png">
</head>
<body class="page-aurora">
  <button class="theme-toggle" data-theme-icon onclick="toggleTheme()" aria-label="تبديل الوضع الداكن"></button>

  <main class="page-center">
    <div class="auth-card rise" role="search" aria-label="الاستعلام عن النتيجة">
      <span class="logo-ring"><img src="/assets/logo.png" alt="شعار إعدادية الرافدين المهنية"></span>
      <h1 class="brand-title">إعدادية الرافدين المهنية</h1>
      <p class="brand-sub">المنصة الرسمية للاستعلام عن النتائج</p>

      <div class="field">
        <label for="exam">الرقم الامتحاني</label>
        <input id="exam" class="input exam-input" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="اكتب ٨ أرقام">
        <span class="field-hint">الرقم مكوّن من ٨ أرقام، تحصل عليه من إدارة المدرسة.</span>
      </div>
      <p id="error" class="error" hidden></p>
      <button class="btn btn-primary btn-lg btn-block" id="loginBtn" style="margin-top:var(--space-3)"><span data-icon="search"></span>عرض النتيجة</button>
    </div>
  </main>

  <footer class="page-foot rise d2">
    منصة رسمية لعرض النتائج — إعدادية الرافدين المهنية
    <br><a href="/admin-login.html">دخول الإدارة</a>
  </footer>

  <script src="/js/icons.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
