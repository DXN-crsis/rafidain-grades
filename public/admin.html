<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة — إعدادية الرافدين المهنية</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/logo.png">
  <style>
    .layout { display: flex; min-height: calc(100vh - 6px); }
    .sidebar {
      width: 240px; flex-shrink: 0; padding: 1.25rem;
      display: flex; flex-direction: column; gap: 0.5rem;
      background: var(--card-bg); border-left: 1px solid var(--card-border);
      backdrop-filter: blur(18px);
    }
    .sidebar .logo-circle { width: 72px; height: 72px; }
    .sidebar h2 { font-size: 1rem; text-align: center; margin: 0.5rem 0 1rem; }
    .nav-btn {
      display: flex; align-items: center; gap: 0.6rem; width: 100%;
      padding: 0.7rem 1rem; border: none; border-radius: 12px;
      background: transparent; color: var(--text); font-family: inherit;
      font-size: 0.95rem; font-weight: 700; cursor: pointer; text-align: right;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: var(--green-light); }
    .nav-btn.active { background: var(--green); color: #fff; }
    .nav-btn svg { width: 18px; height: 18px; }
    .sidebar .grow { flex: 1; }
    main { flex: 1; padding: 1.5rem; max-width: 1100px; }
    .toolbar { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
    .toolbar .input { width: auto; min-width: 180px; }
    select.input { appearance: none; }
    .list-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0; border-bottom: 1px solid var(--card-border); }
    .list-row .grow { flex: 1; font-weight: 700; }
    .list-row .muted { color: var(--text-muted); font-size: 0.85rem; font-weight: 400; }
    .icon-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0.3rem; border-radius: 8px; }
    .icon-btn:hover { color: var(--green); background: var(--green-light); }
    .icon-btn.danger:hover { color: var(--danger); background: rgba(192,57,43,0.1); }
    .icon-btn svg { width: 17px; height: 17px; }
    .toast {
      position: fixed; bottom: 20px; right: 50%; transform: translateX(50%);
      background: var(--green); color: #fff; font-weight: 700;
      padding: 0.7rem 1.6rem; border-radius: 999px; z-index: 100;
      animation: fadeUp 0.3s ease both;
    }
    .toast.error { background: var(--danger); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; align-items: start; }
    @media (max-width: 800px) { .layout { flex-direction: column; } .sidebar { width: 100%; } .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="flag-bar"><span class="red"></span><span class="white"></span><span class="black"></span></div>
  <button class="theme-toggle" data-theme-icon onclick="toggleTheme()" aria-label="تبديل الوضع الداكن"></button>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo-circle"><img src="/assets/logo.png" alt="شعار المدرسة"></div>
      <h2>إعدادية الرافدين المهنية<br><span style="color:var(--text-muted);font-size:0.8rem">لوحة الإدارة</span></h2>
      <button class="nav-btn" data-route="catalog"><span data-icon="layers"></span>الأقسام والمراحل</button>
      <button class="nav-btn" data-route="students"><span data-icon="users"></span>الطلبة</button>
      <button class="nav-btn" data-route="grades"><span data-icon="grid"></span>الدرجات</button>
      <div class="grow"></div>
      <button class="nav-btn" id="logoutBtn"><span data-icon="logout"></span>تسجيل الخروج</button>
    </aside>
    <main id="view"></main>
  </div>
  <script src="/js/icons.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
