<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة — إعدادية الرافدين المهنية</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/logo.png">
</head>
<body class="page-admin">
  <a class="skip-link" href="#view">تخطي إلى المحتوى</a>

  <header class="admin-band">
    <div class="waves waves-band" aria-hidden="true">
      <svg class="wave w3" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 52 C60 82 120 82 180 52 C240 22 300 22 360 52 C420 82 480 82 540 52 C600 22 660 22 720 52 C780 82 840 82 900 52 C960 22 1020 22 1080 52 C1140 82 1200 82 1260 52 C1320 22 1380 22 1440 52 L1440 120 L0 120 Z"/></svg>
      <svg class="wave w2" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 64 C60 88 120 88 180 64 C240 40 300 40 360 64 C420 88 480 88 540 64 C600 40 660 40 720 64 C780 88 840 88 900 64 C960 40 1020 40 1080 64 C1140 88 1200 88 1260 64 C1320 40 1380 40 1440 64 L1440 120 L0 120 Z"/></svg>
      <svg class="wave w1" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 76 C60 60 120 60 180 76 C240 92 300 92 360 76 C420 60 480 60 540 76 C600 92 660 92 720 76 C780 60 840 60 900 76 C960 92 1020 92 1080 76 C1140 60 1200 60 1260 76 C1320 92 1380 92 1440 76 L1440 120 L0 120 Z"/></svg>
    </div>
    <div class="band-inner">
      <div class="band-brand">
        <img class="band-logo" src="/assets/logo.png" alt="">
        <div class="band-titles">
          <span class="band-name">إعدادية الرافدين المهنية</span>
          <span class="band-role">لوحة إدارة النتائج</span>
        </div>
      </div>
      <div class="band-actions">
        <button class="icon-btn band-btn" data-theme-icon onclick="toggleTheme()" aria-label="تبديل الوضع الداكن"></button>
        <button class="icon-btn band-btn" id="logoutBtn" title="تسجيل الخروج" aria-label="تسجيل الخروج"><span data-icon="logout"></span></button>
      </div>
    </div>
  </header>

  <div class="admin-shell">
    <nav class="admin-nav" id="adminNav" aria-label="التنقل الرئيسي">
      <button class="nav-btn" data-route="quick"><span data-icon="zap"></span>الإضافة السريعة</button>
      <button class="nav-btn" data-route="catalog"><span data-icon="layers"></span>الأقسام والمراحل</button>
      <button class="nav-btn" data-route="students"><span data-icon="users"></span>الطلبة</button>
      <button class="nav-btn" data-route="grades"><span data-icon="grid"></span>الدرجات</button>
      <button class="nav-btn" data-route="password"><span data-icon="lock"></span>كلمة المرور</button>
    </nav>
    <main class="admin-main" id="view"></main>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
