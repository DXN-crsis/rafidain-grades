<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>النتيجة — إعدادية الرافدين المهنية</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/logo.png">
</head>
<body class="page-aurora">
  <button class="theme-toggle" data-theme-icon onclick="toggleTheme()" aria-label="تبديل الوضع الداكن"></button>

  <main class="result-wrap" id="result">
    <div class="result-card rise">
      <header class="result-head">
        <span class="logo-ring"><img src="/assets/logo.png" alt="شعار إعدادية الرافدين المهنية"></span>
        <div>
          <div class="school-name">إعدادية الرافدين المهنية</div>
          <div class="head-sub">نتيجة الطالب — وثيقة إلكترونية</div>
        </div>
      </header>
      <div class="river-line" aria-hidden="true"></div>

      <section class="result-identity">
        <h1 id="studentName"></h1>
        <ul class="meta-chips" id="studentMeta"></ul>
      </section>

      <div class="table-wrap">
        <table class="grades" aria-label="جدول درجات الطالب">
          <thead id="gradesHead"></thead>
          <tbody id="gradesBody"></tbody>
        </table>
      </div>

      <div class="result-actions no-print">
        <button class="btn btn-ghost" id="printBtn"><span data-icon="printer"></span>طباعة النتيجة</button>
        <button class="btn btn-primary" id="backBtn"><span data-icon="arrowRight"></span>استعلام جديد</button>
      </div>
    </div>
  </main>

  <script src="/js/icons.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
