<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول الإدارة — إعدادية الرافدين المهنية</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/logo.png">
  <style>
    .login-wrap { min-height: calc(100vh - 6px); display: grid; place-items: center; padding: 1.5rem; }
    .login-card { width: 100%; max-width: 420px; text-align: center; }
    .login-card h1 { font-size: 1.5rem; font-weight: 800; margin-top: 1rem; }
    .subtitle { color: var(--text-muted); margin: 0.25rem 0 1.5rem; }
    .field { text-align: right; margin-bottom: 1rem; }
    .field label { display: block; font-weight: 700; margin-bottom: 0.6rem; }
    .field-input { position: relative; }
    .field-input svg { position: absolute; top: 50%; right: 1rem; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted); pointer-events: none; }
    .field-input .input { padding-inline-end: 2.7rem; }
    #loginBtn { width: 100%; justify-content: center; margin-top: 0.5rem; }
    .error { color: var(--danger); margin-top: 0.8rem; font-weight: 700; }
    .back-link { display: block; margin-top: 1.25rem; color: var(--green); text-decoration: none; font-weight: 700; }
    footer { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 1rem; }
  </style>
</head>
<body>
  <div class="flag-bar"><span class="red"></span><span class="white"></span><span class="black"></span></div>
  <button class="theme-toggle" data-theme-icon onclick="toggleTheme()" aria-label="تبديل الوضع الداكن"></button>
  <div class="login-wrap">
    <div class="glass-card login-card fade-in">
      <div class="logo-circle"><img src="/assets/logo.png" alt="شعار إعدادية الرافدين المهنية"></div>
      <h1>إعدادية الرافدين المهنية</h1>
      <p class="subtitle">لوحة إدارة النتائج</p>
      <div class="field">
        <label for="username">اسم المستخدم</label>
        <div class="field-input">
          <input id="username" class="input" autocomplete="username" placeholder="اسم المستخدم">
          <span data-icon="user"></span>
        </div>
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <div class="field-input">
          <input id="password" type="password" class="input" autocomplete="current-password" placeholder="كلمة المرور">
          <span data-icon="lock"></span>
        </div>
      </div>
      <button class="btn btn-primary" id="loginBtn">تسجيل الدخول</button>
      <p id="error" class="error" hidden></p>
      <a class="back-link" href="/">العودة لصفحة الطلبة</a>
    </div>
  </div>
  <footer class="fade-in delay-2">
    منصة رسمية لعرض النتائج — إعدادية الرافدين المهنية
  </footer>
  <script src="/js/icons.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = window.icons[el.dataset.icon] || ''; });
    const err = document.getElementById('error');
    async function login() {
      err.hidden = true;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      if (res.ok) { location.href = '/admin.html'; return; }
      const data = await res.json().catch(() => ({}));
      err.textContent = data.error || 'حدث خطأ';
      err.hidden = false;
    }
    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
