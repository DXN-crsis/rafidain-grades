<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول الإدارة — إعدادية الرافدين المهنية</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/logo.png">
</head>
<body class="page-aurora">
  <button class="theme-toggle" data-theme-icon onclick="toggleTheme()" aria-label="تبديل الوضع الداكن"></button>

  <main class="page-center">
    <div class="auth-card rise">
      <span class="logo-ring"><img src="/assets/logo.png" alt="شعار إعدادية الرافدين المهنية"></span>
      <h1 class="brand-title">إعدادية الرافدين المهنية</h1>
      <p class="brand-sub">لوحة إدارة النتائج — تسجيل الدخول</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">اسم المستخدم</label>
          <input id="username" class="input" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <input id="password" type="password" class="input" autocomplete="current-password">
        </div>
        <p id="error" class="error" hidden></p>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="loginBtn">تسجيل الدخول</button>
      </form>

      <div class="auth-links">
        <a href="/"><span data-icon="arrowRight"></span>العودة إلى صفحة الاستعلام عن النتائج</a>
      </div>
    </div>
  </main>

  <footer class="page-foot rise d2">منصة رسمية لعرض النتائج — إعدادية الرافدين المهنية</footer>

  <script src="/js/icons.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    (function () {
      const NET_ERR = 'تعذر الاتصال بالخادم. تأكد من تشغيل الخادم ثم حاول مرة أخرى.';
      const form = document.getElementById('loginForm');
      const err = document.getElementById('error');
      const loginBtn = document.getElementById('loginBtn');
      const userInput = document.getElementById('username');
      const passInput = document.getElementById('password');

      function showError(msg) {
        err.textContent = msg;
        err.hidden = false;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.hidden = true;
        const username = userInput.value.trim();
        const password = passInput.value;
        if (!username || !password) {
          showError('اكتب اسم المستخدم وكلمة المرور أولاً.');
          (username ? passInput : userInput).focus();
          return;
        }
        loginBtn.disabled = true;
        const original = loginBtn.textContent;
        loginBtn.textContent = 'جارٍ الدخول…';
        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          if (res.ok) { location.href = '/admin.html'; return; }
          const data = await res.json().catch(() => ({}));
          showError(data.error || 'حدث خطأ، حاول مرة أخرى.');
        } catch {
          showError(NET_ERR);
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = original;
        }
      });
    })();
  </script>
</body>
</html>
