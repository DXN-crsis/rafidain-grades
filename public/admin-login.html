<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول الإدارة — إعدادية الرافدين المهنية</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/logo.png">
</head>
<body>
  <button class="theme-toggle" data-theme-icon onclick="toggleTheme()" aria-label="تبديل الوضع الداكن"></button>

  <main class="page-center">
    <div class="auth-card rise">
      <div class="logo-badge"><img src="/assets/logo.png" alt="شعار إعدادية الرافدين المهنية"></div>
      <h1 class="brand-title">إعدادية الرافدين المهنية</h1>
      <p class="brand-sub">لوحة إدارة النتائج — تسجيل الدخول</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">اسم المستخدم</label>
          <input id="username" class="input" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <input id="password" type="password" class="input" autocomplete="current-password">
        </div>
        <p id="error" class="error" hidden></p>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="loginBtn">تسجيل الدخول</button>
      </form>

      <div class="auth-links">
        <a href="/"><span data-icon="arrowRight"></span>العودة إلى صفحة الاستعلام عن النتائج</a>
      </div>
    </div>
  </main>

  <footer class="page-foot rise d2">منصة رسمية لعرض النتائج — إعدادية الرافدين المهنية</footer>

  <div class="waves waves-page" aria-hidden="true">
    <svg class="wave w3" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 52 C60 82 120 82 180 52 C240 22 300 22 360 52 C420 82 480 82 540 52 C600 22 660 22 720 52 C780 82 840 82 900 52 C960 22 1020 22 1080 52 C1140 82 1200 82 1260 52 C1320 22 1380 22 1440 52 L1440 120 L0 120 Z"/></svg>
    <svg class="wave w2" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 64 C60 88 120 88 180 64 C240 40 300 40 360 64 C420 88 480 88 540 64 C600 40 660 40 720 64 C780 88 840 88 900 64 C960 40 1020 40 1080 64 C1140 88 1200 88 1260 64 C1320 40 1380 40 1440 64 L1440 120 L0 120 Z"/></svg>
    <svg class="wave w1" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 76 C60 60 120 60 180 76 C240 92 300 92 360 76 C420 60 480 60 540 76 C600 92 660 92 720 76 C780 60 840 60 900 76 C960 92 1020 92 1080 76 C1140 60 1200 60 1260 76 C1320 92 1380 92 1440 76 L1440 120 L0 120 Z"/></svg>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    (function () {
      const NET_ERR = 'تعذر الاتصال بالخادم. تأكد من تشغيل الخادم ثم حاول مرة أخرى.';
      const form = document.getElementById('loginForm');
      const err = document.getElementById('error');
      const loginBtn = document.getElementById('loginBtn');
      const userInput = document.getElementById('username');
      const passInput = document.getElementById('password');

      function showError(msg) {
        err.textContent = msg;
        err.hidden = false;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.hidden = true;
        const username = userInput.value.trim();
        const password = passInput.value;
        if (!username || !password) {
          showError('اكتب اسم المستخدم وكلمة المرور أولاً.');
          (username ? passInput : userInput).focus();
          return;
        }
        loginBtn.disabled = true;
        const original = loginBtn.textContent;
        loginBtn.textContent = 'جارٍ الدخول…';
        try {
          const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          if (res.ok) { location.href = '/admin.html'; return; }
          const data = await res.json().catch(() => ({}));
          showError(data.error || 'حدث خطأ، حاول مرة أخرى.');
        } catch {
          showError(NET_ERR);
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = original;
        }
      });
    })();
  </script>
</body>
</html>
